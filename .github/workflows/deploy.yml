name: Deploy to streatmotortyres.co.uk

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-smt-prod
  cancel-in-progress: false

# Non-secret server paths (the cPanel Node.js app for the main domain).
# Only the SSH connection details live in repo secrets.
env:
  APP_ROOT: streatmotortyres
  DEPLOY_PATH: /home/streqtjv/streatmotortyres
  NODEVENV_ACTIVATE: /home/streqtjv/nodevenv/streatmotortyres/20/bin/activate

jobs:
  deploy:
    name: Build & Deploy (cPanel / Passenger)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync build to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next/cache' \
            --exclude '.env' \
            --exclude 'tmp/' \
            --exclude '.htaccess' \
            --exclude 'stderr.log' \
            --exclude '.well-known' \
            --exclude 'cgi-bin' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Install prod deps & restart Passenger
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "bash -s" << EOF
          set -e
          source ${{ env.NODEVENV_ACTIVATE }}
          cd "${{ env.DEPLOY_PATH }}"
          echo "==> Installing production dependencies"
          npm ci
          echo "==> Restarting Passenger app"
          cloudlinux-selector restart --json --interpreter nodejs --app-root ${{ env.APP_ROOT }}
          echo "==> Deployment complete"
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
